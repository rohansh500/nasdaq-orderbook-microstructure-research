[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasdaq-orderbook-microstructure-research"
version = "1.0.0"
description = "LOBSTER and Nasdaq ITCH order-book reconstruction and short-horizon prediction research."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Rohan Sharma"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4,<5",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "huggingface-hub>=0.24,<2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4,<5",
  "ipykernel>=6,<7",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]
web-export = [
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
