name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts/export_web_data.py scripts/export_web_models.py scripts/verify_web_assets.py
      - name: Format
        run: python -m ruff format --check src tests scripts/export_web_data.py scripts/export_web_models.py scripts/verify_web_assets.py
      - name: Test
        run: python -m pytest -q

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install website dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint website
        run: npm run lint
      - name: Type-check website
        run: npm run typecheck
      - name: Build website
        run: npm run build
